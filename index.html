<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>خلية الحروف | مجموعة دراية</title>

<style>
@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Light.otf') format('opentype');
  font-weight:300;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Regular.otf') format('opentype');
  font-weight:400;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Medium.otf') format('opentype');
  font-weight:500;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Bold.otf') format('opentype');
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

@font-face{
  font-family:'Thmanyah';
  src:url('fonts/thmanyahserifdisplay-Black.otf') format('opentype');
  font-weight:900;
  font-style:normal;
  font-display:swap;
}

*{box-sizing:border-box}

:root{
  --bg1:#050712;
  --bg2:#101827;
  --text:#fff;
  --cell:#f8fafc;
  --cellText:#111827;
  --teamLR:#f97316;
  --teamTB:#2563eb;
  --gold:#d4af37;
}

body.light{
  --bg1:#f8fafc;
  --bg2:#e5e7eb;
  --text:#111827;
  --cell:#ffffff;
  --cellText:#111827;
}

body{
  margin:0;
  min-height:100vh;
  font-family:'Thmanyah',sans-serif;
  background:
    radial-gradient(circle at top,rgba(212,175,55,.25),transparent 28%),
    linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg1));
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:var(--text);
}

.page{
  width:100%;
  max-width:1180px;
  padding:20px;
}

.main-logo{
  width:185px;
  display:block;
  margin:0 auto 12px;
  filter:drop-shadow(0 0 30px rgba(212,175,55,.35));
}

.toolbar{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.panel{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  padding:10px 14px;
  border-radius:18px;
}

input,select{
  font-family:'Thmanyah',sans-serif;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  color:var(--text);
  border-radius:12px;
  padding:8px 10px;
  outline:none;
}

.btn{
  font-family:'Thmanyah',sans-serif;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);
  color:var(--text);
  padding:10px 22px;
  border-radius:15px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.16);
}

.timer-box{
  font-size:34px;
  line-height:1;
  font-weight:900;
  color:var(--gold);
  margin:0;
  letter-spacing:1px;
  text-shadow:0 0 18px rgba(212,175,55,.35);
}

.board-wrap{
  position:relative;
  width:820px;
  height:590px;
  margin:0 auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

.board-glow{
  position:absolute;
  width:700px;
  height:520px;
  border-radius:50%;
  background:
    radial-gradient(circle at center,rgba(212,175,55,.16),transparent 55%),
    radial-gradient(circle at left,var(--teamLR),transparent 38%),
    radial-gradient(circle at right,var(--teamLR),transparent 38%),
    radial-gradient(circle at top,var(--teamTB),transparent 34%),
    radial-gradient(circle at bottom,var(--teamTB),transparent 34%);
  filter:blur(34px);
  opacity:.38;
}

svg{
  width:780px;
  height:580px;
  overflow:visible;
  z-index:2;
}

.cell{cursor:pointer}

.hex{
  fill:var(--cell);
  stroke:#111827;
  stroke-width:3;
  transition:.18s;
}

.letter{
  font-size:39px;
  font-weight:800;
  fill:var(--cellText);
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}

.cell:hover .hex{fill:#fde68a}

.cell.selected .hex{
  stroke:#facc15;
  stroke-width:8;
  filter:drop-shadow(0 0 16px rgba(250,204,21,.9));
}

.cell.teamLR .hex{
  fill:var(--teamLR);
  filter:drop-shadow(0 0 16px var(--teamLR));
}

.cell.teamTB .hex{
  fill:var(--teamTB);
  filter:drop-shadow(0 0 16px var(--teamTB));
}

.cell.teamLR .letter,
.cell.teamTB .letter{
  fill:white;
}

.cell.win .hex{
  stroke:#fde68a;
  stroke-width:9;
  filter:drop-shadow(0 0 24px gold);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
}

.modal.show{display:flex}

.modal-box{
  width:90%;
  max-width:620px;
  padding:36px;
  border-radius:32px;
  background:
    radial-gradient(circle at top,rgba(212,175,55,.25),transparent 35%),
    linear-gradient(145deg,#111827,#020617);
  border:1px solid rgba(212,175,55,.45);
  box-shadow:0 0 85px rgba(212,175,55,.35);
  color:white;
}

.modal-box h2{
  font-size:36px;
  margin:0 0 18px;
  color:#fde68a;
}

.start-grid{
  display:grid;
  gap:14px;
  text-align:right;
}

.start-row{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:14px;
}

.start-row label{
  display:block;
  margin-bottom:8px;
  color:#fde68a;
  font-weight:800;
}

.start-row input{
  width:100%;
  margin-bottom:12px;
}

.palette{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.color-choice{
  width:44px;
  height:44px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.35);
  cursor:pointer;
  transition:.2s;
}

.color-choice:hover{
  transform:scale(1.1);
}

.color-choice.active{
  border-color:#fde68a;
  box-shadow:0 0 18px #fde68a;
}

.color-choice.disabled{
  opacity:.25;
  pointer-events:none;
}

.modal-box p{
  font-size:23px;
  line-height:1.8;
}


.winner-icon{
  font-size:64px;
  line-height:1;
  margin-bottom:12px;
  filter:drop-shadow(0 0 24px rgba(212,175,55,.8));
}

#winnerText{
  font-size:34px;
  font-weight:900;
  color:#fde68a;
  margin:8px 0 8px;
}

.winner-sub{
  font-size:20px;
  opacity:.9;
  margin-bottom:20px;
}

.match-score{
  width:min(1040px,96vw);
  margin:12px auto 4px;
  display:grid;
  grid-template-columns:minmax(190px,1fr) minmax(170px,230px) minmax(190px,1fr);
  align-items:center;
  gap:14px;
  color:var(--text);

  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  padding:12px 16px;
  box-shadow:0 18px 46px rgba(0,0,0,.22);
  backdrop-filter:blur(14px);
}

.score-pill{
  min-width:0;
  padding:12px 18px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  font-weight:900;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score-pill .num{
  display:inline-block;
  margin-inline-start:10px;
  color:#fde68a;
  font-size:26px;
  vertical-align:middle;
}

.hud-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.round-pill{
  min-width:155px;
  padding:7px 12px;
  border-radius:16px;
  background:rgba(212,175,55,.12);
  border:1px solid rgba(212,175,55,.28);
  font-weight:900;
  color:#fde68a;
  font-size:15px;
}

.match-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.match-option{
  display:block;
  cursor:pointer;
}

.match-option input{
  display:none;
}

.match-option span{
  display:block;
  padding:12px 10px;
  border-radius:16px;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.14);
  text-align:center;
  font-weight:900;
  transition:.2s;
}

.match-option input:checked + span{
  border-color:#fde68a;
  box-shadow:0 0 18px rgba(253,230,138,.45);
  color:#fde68a;
}

.flame{
  position:fixed;
  bottom:-30px;
  z-index:155;
  pointer-events:none;
  font-size:34px;
  animation:flameRise 2.2s ease-out forwards;
  filter:drop-shadow(0 0 14px #f97316);
}

@keyframes flameRise{
  0%{transform:translateY(0) scale(.8) rotate(0deg); opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-72vh) scale(1.45) rotate(24deg); opacity:0}
}


.action-row{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.confetti{
  position:fixed;
  top:-12px;
  width:10px;
  height:16px;
  border-radius:3px;
  z-index:150;
  pointer-events:none;
  animation:confettiFall 2.8s linear forwards;
}

@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg); opacity:1}
  100%{transform:translateY(110vh) rotate(720deg); opacity:0}
}

body.presentation .toolbar,
body.presentation .page > .action-row{
  display:none;
}

body.presentation .page{
  max-width:100vw;
}

body.presentation .main-logo{
  width:155px;
  margin-bottom:4px;
}

body.presentation .timer-box{
  margin:0 0 -25px;
}

.presentation-exit{
  display:none;
  position:fixed;
  bottom:18px;
  left:18px;
  z-index:80;
}

body.presentation .presentation-exit{
  display:block;
}

@media(max-width:850px){
  body{
    display:block;
    min-height:100svh;
    overflow-x:hidden;
  }

  .page{
    width:100%;
    max-width:100%;
    padding:12px;
    overflow:hidden;
  }

  .main-logo{
    width:135px;
    margin:0 auto 10px;
  }

  .toolbar{
    gap:8px;
    margin-bottom:8px;
  }

  .panel{
    width:100%;
    gap:8px;
    padding:8px;
    border-radius:16px;
  }

  .panel .btn{
    flex:1 1 120px;
    padding:9px 10px;
    font-size:15px;
  }

  .panel select{
    flex:1 1 72px;
    min-width:72px;
    padding:8px;
    font-size:15px;
  }

  .timer-box{
    font-size:28px;
    margin:6px 0 0;
  }

  .match-score{
    width:100%;
    grid-template-columns:1fr;
    margin:8px auto 0;
    gap:8px;
    padding:10px;
  }

  .hud-center{
    order:-1;
  }

  .score-pill{
    width:100%;
    min-width:0;
    padding:8px 10px;
    font-size:15px;
  }

  .round-pill{
    width:auto;
    min-width:150px;
  }

  .match-options{
    grid-template-columns:1fr;
  }

  .board-wrap{
    width:100%;
    height:auto;
    margin:0 auto 4px;
    transform:none;
  }

  .board-glow{
    width:88vw;
    height:66vw;
    filter:blur(22px);
    opacity:.34;
  }

  svg{
    width:98vw;
    height:auto;
    max-width:780px;
  }

  .btn#resetBtn{
    width:100%;
    max-width:280px;
    margin-top:4px;
  }

  .modal-box{
    width:92%;
    max-width:520px;
    max-height:88svh;
    overflow:auto;
    padding:22px;
    border-radius:26px;
  }

  .modal-box h2{
    font-size:28px;
    margin-bottom:14px;
  }

  .modal-box p{
    font-size:19px;
  }

  .start-grid{
    gap:10px;
  }

  .start-row{
    padding:12px;
  }

  .start-row input,
  input,
  select{
    font-size:16px;
  }

  .palette{
    justify-content:center;
  }

  .color-choice{
    width:42px;
    height:42px;
  }
}

@media(max-width:420px){
  .main-logo{width:120px}
  .timer-box{font-size:24px}
  .panel span{font-size:14px}
  .btn{font-size:15px}
  .letter{font-size:37px}
}
</style>
</head>

<body>

<div class="page">

  <img src="images/daraya-logo.png" class="main-logo" alt="مجموعة دراية">

  <div class="toolbar">
    <div class="panel">
      <button class="btn" onclick="toggleTheme()">ليلي / نهاري</button>
      <button class="btn" onclick="toggleFullscreen()">شاشة كاملة</button>
    </div>

    <div class="panel">
      <select id="minutes"></select>
      <span>دقيقة</span>
      <select id="seconds"></select>
      <span>ثانية</span>
      <button class="btn" onclick="startTimer()">تشغيل</button>
      <button class="btn" onclick="pauseTimer()">إيقاف</button>
    </div>
  </div>

  <div class="match-score" id="matchScore">
    <div class="score-pill" id="tbScorePill">فوق/تحت <span class="num" id="tbWins">0</span></div>
    <div class="hud-center">
      <div class="timer-box" id="timerDisplay">00:30</div>
      <div class="round-pill" id="roundInfo">جولة 1</div>
    </div>
    <div class="score-pill" id="lrScorePill">يمين/يسار <span class="num" id="lrWins">0</span></div>
  </div>

  <div class="board-wrap">
    <div class="board-glow"></div>
    <svg id="svgBoard" viewBox="0 0 780 580"></svg>
  </div>

  <div class="action-row">
    <button class="btn" onclick="newBoard()">خلية جديدة</button>
    <button class="btn" onclick="togglePresentation()">وضع العرض</button>
    <button class="btn" id="resetBtn" onclick="confirmReset()">إعادة اللعبة</button>
  </div>

  <button class="btn presentation-exit" onclick="togglePresentation()">خروج العرض</button>

</div>

<div class="modal show" id="setupModal">
  <div class="modal-box">
    <h2>إعداد الفرق</h2>

    <div class="start-grid">
      <div class="start-row">
        <label>فريق فوق ↕ تحت</label>
        <input id="teamTBName" value="الفريق الأزرق">
        <div class="palette" id="paletteTB"></div>
      </div>

      <div class="start-row">
        <label>فريق يمين ↔ يسار</label>
        <input id="teamLRName" value="الفريق البرتقالي">
        <div class="palette" id="paletteLR"></div>
      </div>

      <div class="start-row">
        <label>نظام الجولات</label>
        <div class="match-options">
          <label class="match-option"><input type="radio" name="matchMode" value="1" checked><span>جولة واحدة</span></label>
          <label class="match-option"><input type="radio" name="matchMode" value="3"><span>3 جولات</span></label>
          <label class="match-option"><input type="radio" name="matchMode" value="5"><span>5 جولات</span></label>
        </div>
      </div>
    </div>

    <br>
    <button class="btn" onclick="startGame()">بدء اللعبة</button>
  </div>
</div>

<div class="modal" id="rulesModal">
  <div class="modal-box">
    <h2>طريقة الفوز</h2>
    <p id="rulesText"></p>
    <button class="btn" onclick="closeRules()">فهمت</button>
  </div>
</div>

<div class="modal" id="winnerModal">
  <div class="modal-box">
    <div class="winner-icon">🏆</div>
    <h2>انتهت المسابقة</h2>
    <p id="winnerText"></p>
    <div class="winner-sub" id="winnerSub">تهانينا للفريق الفائز</div>
    <div class="action-row">
      <button class="btn" id="nextRoundBtn" onclick="newRoundFromWinner()">الجولة التالية</button>
      <button class="btn" onclick="document.getElementById('winnerModal').classList.remove('show')">إغلاق</button>
      <button class="btn" onclick="resetGame()">إعادة كاملة</button>
    </div>
  </div>
</div>

<script>
const colors = [
  {name:"أزرق", value:"#2563eb"},
  {name:"برتقالي", value:"#f97316"},
  {name:"بنفسجي", value:"#8b5cf6"},
  {name:"أخضر", value:"#10b981"},
  {name:"وردي", value:"#ec4899"},
  {name:"أحمر", value:"#ef4444"}
];

let selectedTBColor = "#2563eb";
let selectedLRColor = "#f97316";

const lettersPool = [
  "أ","ب","ت","ث","ج",
  "ح","خ","د","ذ","ر",
  "ز","س","ش","ص","ض",
  "ط","ظ","ع","غ","ف",
  "ق","ك","ل","م","ن"
];

const rows = 5;
const cols = 5;

const R = 60;
const W = Math.sqrt(3) * R;
const H = 2 * R;
const xStep = W;
const yStep = H * 0.75;
const startX = 140;
const startY = 85;

const svg = document.getElementById("svgBoard");
const cellMap = new Map();

let gameOver = false;
let gameStarted = false;
let timerInterval = null;
let remainingSeconds = 30;
let resetArmed = false;
let totalRounds = 1;
let targetWins = 1;
let currentRound = 1;
let tbRoundWins = 0;
let lrRoundWins = 0;
let matchOver = false;

setupDropdowns();
renderPalettes();
createBoard();
updateTimerDisplay();
applyTeamColors();
updateMatchScore();

document.getElementById("teamTBName").addEventListener("input", updateMatchScore);
document.getElementById("teamLRName").addEventListener("input", updateMatchScore);

function setupDropdowns(){
  const m = document.getElementById("minutes");
  const s = document.getElementById("seconds");

  for(let i=0;i<=10;i++){
    m.innerHTML += `<option value="${i}">${i}</option>`;
  }

  for(let i=0;i<60;i+=5){
    s.innerHTML += `<option value="${i}">${i}</option>`;
  }

  m.value = 0;
  s.value = 30;
}

function renderPalettes(){
  const tb = document.getElementById("paletteTB");
  const lr = document.getElementById("paletteLR");

  tb.innerHTML = "";
  lr.innerHTML = "";

  colors.forEach(color => {
    const btnTB = document.createElement("button");
    btnTB.className = "color-choice";
    btnTB.style.background = color.value;
    btnTB.title = color.name;

    if(color.value === selectedTBColor) btnTB.classList.add("active");
    if(color.value === selectedLRColor) btnTB.classList.add("disabled");

    btnTB.onclick = () => {
      selectedTBColor = color.value;
      renderPalettes();
      applyTeamColors();
    };

    tb.appendChild(btnTB);

    const btnLR = document.createElement("button");
    btnLR.className = "color-choice";
    btnLR.style.background = color.value;
    btnLR.title = color.name;

    if(color.value === selectedLRColor) btnLR.classList.add("active");
    if(color.value === selectedTBColor) btnLR.classList.add("disabled");

    btnLR.onclick = () => {
      selectedLRColor = color.value;
      renderPalettes();
      applyTeamColors();
    };

    lr.appendChild(btnLR);
  });
}

function applyTeamColors(){
  document.documentElement.style.setProperty("--teamTB", selectedTBColor);
  document.documentElement.style.setProperty("--teamLR", selectedLRColor);
}

function updateMatchScore(){
  const tb = document.getElementById("teamTBName")?.value || "فوق/تحت";
  const lr = document.getElementById("teamLRName")?.value || "يمين/يسار";

  document.getElementById("tbScorePill").innerHTML = `${tb} <span class="num" id="tbWins">${tbRoundWins}</span>`;
  document.getElementById("lrScorePill").innerHTML = `${lr} <span class="num" id="lrWins">${lrRoundWins}</span>`;
  document.getElementById("roundInfo").textContent = totalRounds === 1 ? "جولة واحدة" : `جولة ${currentRound} من ${totalRounds}`;
}

function startGame(){
  applyTeamColors();

  totalRounds = Number(document.querySelector('input[name="matchMode"]:checked').value);
  targetWins = Math.floor(totalRounds / 2) + 1;
  currentRound = 1;
  tbRoundWins = 0;
  lrRoundWins = 0;
  matchOver = false;
  updateMatchScore();

  document.getElementById("setupModal").classList.remove("show");

  const tb = document.getElementById("teamTBName").value || "الفريق الأول";
  const lr = document.getElementById("teamLRName").value || "الفريق الثاني";

  document.getElementById("rulesText").innerHTML =
    `${tb}: من فوق لتحت<br>${lr}: من يمين ليسار<br><br>نظام المباراة: ${totalRounds === 1 ? "جولة واحدة" : totalRounds + " جولات"}<br>الفائز يحتاج ${targetWins} ${targetWins === 1 ? "فوز" : "انتصارات"}`;

  document.getElementById("rulesModal").classList.add("show");
}

function closeRules(){
  gameStarted = true;
  document.getElementById("rulesModal").classList.remove("show");
}

function shuffle(array){
  const copy = [...array];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function createBoard(){
  svg.innerHTML = "";
  cellMap.clear();

  const letters = shuffle(lettersPool);
  let index = 0;

  for(let row = 0; row < rows; row++){
    const offsetX = row % 2 === 0 ? W / 2 : 0;

    for(let col = 0; col < cols; col++){
      const cx = startX + offsetX + col * xStep;
      const cy = startY + row * yStep;
      const letter = letters[index++];

      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","cell");
      g.dataset.state = "0";
      g.dataset.row = row;
      g.dataset.col = col;
      g.dataset.key = `${row},${col}`;
      g.dataset.owner = "";

      const polygon = document.createElementNS("http://www.w3.org/2000/svg","polygon");
      polygon.setAttribute("points",getHexPoints(cx,cy,R));
      polygon.setAttribute("class","hex");

      const text = document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x",cx);
      text.setAttribute("y",cy + 5);
      text.setAttribute("class","letter");
      text.textContent = letter;

      g.appendChild(polygon);
      g.appendChild(text);
      g.onclick = () => changeCellState(g);

      svg.appendChild(g);
      cellMap.set(`${row},${col}`,g);
    }
  }
}

function getHexPoints(cx,cy,r){
  const points = [];
  for(let i = 0; i < 6; i++){
    const angle = Math.PI / 180 * (60 * i - 30);
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    points.push(`${x},${y}`);
  }
  return points.join(" ");
}

function changeCellState(cell){
  if(gameOver || !gameStarted) return;

  let state = Number(cell.dataset.state);

  cell.classList.remove("selected","teamLR","teamTB","win");

  state++;
  if(state > 3) state = 0;

  if(state === 1){
    cell.classList.add("selected");
    cell.dataset.owner = "";
  }

  if(state === 2){
    cell.classList.add("teamLR");
    cell.dataset.owner = "teamLR";
  }

  if(state === 3){
    cell.classList.add("teamTB");
    cell.dataset.owner = "teamTB";
  }

  if(state === 0){
    cell.dataset.owner = "";
  }

  cell.dataset.state = state;

  checkWinner("teamLR");
  checkWinner("teamTB");
}

function checkWinner(team){
  const cells = [...document.querySelectorAll(".cell")];

  if(team === "teamLR"){
    const leftSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.col) === 0
    );

    const rightSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.col) === cols - 1
    );

    for(const start of leftSide){
      const path = findPath(start,rightSide,team);
      if(path){
        showWinner(document.getElementById("teamLRName").value, path, "teamLR");
        return true;
      }
    }
  }

  if(team === "teamTB"){
    const topSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.row) === 0
    );

    const bottomSide = cells.filter(c =>
      c.dataset.owner === team && Number(c.dataset.row) === rows - 1
    );

    for(const start of topSide){
      const path = findPath(start,bottomSide,team);
      if(path){
        showWinner(document.getElementById("teamTBName").value, path, "teamTB");
        return true;
      }
    }
  }

  return false;
}

function findPath(start,targets,team){
  const visited = new Set();
  const parent = new Map();
  const stack = [start];

  while(stack.length){
    const current = stack.pop();

    if(visited.has(current.dataset.key)) continue;
    visited.add(current.dataset.key);

    if(targets.includes(current)){
      const path = [];
      let node = current;

      while(node){
        path.push(node);
        node = parent.get(node.dataset.key);
      }

      return path;
    }

    getNeighbors(current).forEach(neighbor => {
      if(neighbor.dataset.owner === team && !visited.has(neighbor.dataset.key)){
        parent.set(neighbor.dataset.key,current);
        stack.push(neighbor);
      }
    });
  }

  return null;
}

function getNeighbors(cell){
  const r = Number(cell.dataset.row);
  const c = Number(cell.dataset.col);
  const pushedRight = r % 2 === 0;

  let coords = [
    [r,c - 1],
    [r,c + 1]
  ];

  if(pushedRight){
    coords.push([r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]);
  }else{
    coords.push([r-1,c],[r-1,c-1],[r+1,c],[r+1,c-1]);
  }

  return coords
    .map(([row,col]) => cellMap.get(`${row},${col}`))
    .filter(Boolean);
}

function showWinner(teamName,path,teamKey){
  if(gameOver) return;

  gameOver = true;
  pauseTimer();

  path.forEach(cell => cell.classList.add("win"));

  if(teamKey === "teamTB") tbRoundWins++;
  if(teamKey === "teamLR") lrRoundWins++;

  const reachedTarget = teamKey === "teamTB" ? tbRoundWins >= targetWins : lrRoundWins >= targetWins;
  matchOver = reachedTarget || totalRounds === 1;

  updateMatchScore();

  if(matchOver){
    document.getElementById("winnerText").textContent = `فاز ${teamName} بالمباراة!`;
    document.getElementById("winnerSub").textContent = `النتيجة: ${tbRoundWins} - ${lrRoundWins}`;
    document.getElementById("nextRoundBtn").textContent = "مباراة جديدة";
  }else{
    document.getElementById("winnerText").textContent = `فاز ${teamName} بالجولة!`;
    document.getElementById("winnerSub").textContent = `النتيجة: ${tbRoundWins} - ${lrRoundWins}`;
    document.getElementById("nextRoundBtn").textContent = "الجولة التالية";
  }

  launchConfetti();
  launchFire();

  setTimeout(() => {
    document.getElementById("winnerModal").classList.add("show");
  },650);
}

function launchConfetti(){
  const palette = [selectedTBColor, selectedLRColor, "#D4AF37", "#FDE68A", "#FFFFFF"];

  for(let i = 0; i < 180; i++){
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = palette[Math.floor(Math.random() * palette.length)];
    piece.style.animationDelay = Math.random() * .7 + "s";
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);

    setTimeout(() => piece.remove(), 4200);
  }
}

function launchFire(){
  for(let i = 0; i < 46; i++){
    const flame = document.createElement("div");
    flame.className = "flame";
    flame.textContent = Math.random() > .35 ? "🔥" : "✨";
    flame.style.left = Math.random() * 100 + "vw";
    flame.style.animationDelay = Math.random() * .8 + "s";
    flame.style.fontSize = (24 + Math.random() * 30) + "px";
    document.body.appendChild(flame);
    setTimeout(() => flame.remove(), 3300);
  }
}

function newRoundFromWinner(){
  document.getElementById("winnerModal").classList.remove("show");

  if(matchOver){
    resetGame();
    return;
  }

  currentRound++;
  newBoard();
  updateMatchScore();
}

function newBoard(){
  pauseTimer();
  gameOver = false;
  gameStarted = true;
  resetArmed = false;
  document.getElementById("resetBtn").textContent = "إعادة اللعبة";
  document.getElementById("winnerModal").classList.remove("show");
  createBoard();
  updateMatchScore();
}

function startTimer(){
  pauseTimer();

  const min = Number(document.getElementById("minutes").value);
  const sec = Number(document.getElementById("seconds").value);

  remainingSeconds = min * 60 + sec;
  if(remainingSeconds <= 0) remainingSeconds = 30;

  updateTimerDisplay();

  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimerDisplay();

    if(remainingSeconds <= 0){
      pauseTimer();
      alert("انتهى الوقت");
    }
  },1000);
}

function pauseTimer(){
  clearInterval(timerInterval);
}

function updateTimerDisplay(){
  const m = String(Math.floor(remainingSeconds / 60)).padStart(2,"0");
  const s = String(remainingSeconds % 60).padStart(2,"0");
  document.getElementById("timerDisplay").textContent = `${m}:${s}`;
}

function confirmReset(){
  const btn = document.getElementById("resetBtn");

  if(!resetArmed){
    resetArmed = true;
    btn.textContent = "اضغط مرة ثانية للتأكيد";

    setTimeout(() => {
      resetArmed = false;
      btn.textContent = "إعادة اللعبة";
    },2500);

    return;
  }

  resetGame();
}

function resetGame(){
  location.reload();
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

function togglePresentation(){
  document.body.classList.toggle("presentation");
}
</script>
